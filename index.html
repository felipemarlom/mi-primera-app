
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera aplicación</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f2f5fa;
    }
    button {
      background: #2458d3;
      color: white;
      padding: 10px 20px;
      cursor: pointer;
    }
    input {
      padding: 10px;
      width: 100px;
    }
  </style>
</head>
<body>

  <h1>Mi primera aplicación</h1>
  <p>¿Cuántas veces quieres escribir Felipe?</p>

  <input type="number" id="numero" min="1" max="100">
  <button onclick="ejecutar()">Ejecutar</button>

  <div id="resultado"></div>

  <script>
    function ejecutar() {
      const numero = Number(document.getElementById("numero").value);
      const resultado = document.getElementById("resultado");

      resultado.innerHTML = "";

      if (!Number.isInteger(numero) || numero < 1 || numero > 100) {
        resultado.textContent = "Ingresa un número entre 1 y 100.";
        return;
      }

      for (let i = 0; i < numero; i++) {
        const linea = document.createElement("p");
        linea.textContent = "Felipe";
        resultado.appendChild(linea);
      }
    }
  </script>

</body>
</html>
